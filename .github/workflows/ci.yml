name: CI

# Least privilege: every job and action runs read-only
permissions:
  contents: read

on:
  # Post-merge validation of the default branch
  push:
    branches: [main]
  # Branch validation for PRs (fork PRs included; Datadog steps skip without secrets)
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dependency, static-code, secret, and IaC scanning run in Datadog-hosted
# Code Security. Required Datadog PR Gates block newly introduced findings.
jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Fork PRs never receive secrets; Datadog upload/instrumentation steps skip there.
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0; version from packageManager
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Sets DD_TRACE_PACKAGE and DD_TRACE_ESM_IMPORT for Test Optimization.
      # GitHub actions cannot set NODE_OPTIONS directly, so the test step wires them.
      - name: Configure Datadog Test Optimization
        if: env.IS_FORK != 'true'
        uses: datadog/test-visibility-github-action@f76512a963e7375dab9ad7f1abc0cacd41806c5c # v2.6.0
        with:
          languages: js
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.com
          service: kranz-tv

      # dd-trace instrumentation is incompatible with V8 coverage because
      # import-in-the-middle adds instrumented files to the coverage denominator.
      - name: Run tests with Datadog tracing
        if: env.IS_FORK != 'true'
        env:
          NODE_OPTIONS: >-
            -r ${{ env.DD_TRACE_PACKAGE }}
            --import ${{ env.DD_TRACE_ESM_IMPORT }}
        run: pnpm test

      # Always runs, including on fork PRs, and enforces the 80% thresholds.
      - name: Run tests with coverage
        run: pnpm test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build Cloudflare Worker
        env:
          VITE_YOUTUBE_API_KEY: '' # triggers mock fallback (safe)
          VITE_DD_RUM_APP_ID: ${{ vars.VITE_DD_RUM_APP_ID }} # repo variable, not secret
          VITE_DD_RUM_CLIENT_TOKEN: ${{ vars.VITE_DD_RUM_CLIENT_TOKEN }}
          VITE_DD_COMMIT_SHA: ${{ github.sha }} # RUM deploy traceability
          VITE_DD_ENV: ci
        run: pnpm build

      - name: Assert Cloudflare client artifact exists
        run: test -d dist/client

      # Uses the lockfile-installed @datadog/datadog-ci. Skips fork PRs where
      # secrets.DD_API_KEY is unavailable.
      - name: Upload sourcemaps to Datadog
        if: env.IS_FORK != 'true'
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          RELEASE_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          pnpm exec datadog-ci sourcemaps upload dist/client/ \
            --service kranz-tv \
            --release-version "$RELEASE_VERSION" \
            --minified-path-prefix /

      # Docker ships the Nitro node-server artifact rather than the Worker build.
      - name: Build Node server (Docker parity)
        run: pnpm build:node

      - name: Assert Nitro server entrypoint exists
        run: test -f .output/server/index.mjs
